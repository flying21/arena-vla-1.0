# 麻雀虽小智能科技（武汉）有限公司
# =============================================================================
# UnifoLM-VLA 训练基础配置
# =============================================================================
# 启动方式（命令行覆盖项优先级更高，见 scripts/run_scripts/*.sh）：
#   accelerate launch --config_file .../deepspeed_zero2.yaml \
#     src/unifolm_vla/training/train_unifolm_vla.py \
#     --config_yaml ./src/unifolm_vla/config/training/unifolm_vla_train.yaml
#
# 配置合并顺序：本 YAML 作为基底 -> 再用命令行 dotlist 覆盖合并
#   （train_unifolm_vla.py 中 OmegaConf.merge(cfg, cli_cfg)）。
# =============================================================================

# ---------------------------------------------------------------------------
# 运行与日志
# ---------------------------------------------------------------------------
run_id: qwenact                              # 本次运行标识（决定输出子目录名）
run_root_dir: results/Checkpoints            # 产物根目录
seed: 42                                     # 随机种子；分布式下会按 rank 偏移
trackers: [jsonl, wandb]                     # 指标记录方式
wandb_entity: your_wandb_entity              # ★ 需修改：W&B 账号
wandb_project: your_wandb_project            # ★ 需修改：W&B 项目名
is_debug: false

# ---------------------------------------------------------------------------
# 模型结构
# ---------------------------------------------------------------------------
framework:
  name: unifolm_vla                          # 对应 FRAMEWORK_REGISTRY 的注册名

  # ---- 视觉语言主干：Qwen2.5-VL ----
  qwenvl:
    base_vlm: /root/unitree_jiang/Unifolm-VLM-0   # ★ 需修改：VLM 主干本地路径
    attn_implementation: flash_attention_2        # 需要 flash-attn==2.5.6
    vl_hidden_dim: 2048                           # 记录用；实际维度从模型 config 读取
    model_type: qwen2_5_vl

  # ---- 动作头：Flow Matching + DiT ----
  action_model:
    input_embedding_dim: 1536
    hidden_size: 1024
    add_pos_embed: True                      # 给动作序列加正弦位置编码
    max_seq_len: 1024

    # --- 以下四个维度键在本代码库中【不被读取】, 仅作记录 -------------------
    # FlowmatchingActionHead 直接从 rlds_dataloader/constants.py 取值, 见
    # DiT_ActionHeader.py:
    #     self.action_dim      = ACTION_DIM
    #     self.proprio_dim     = PROPRIO_DIM
    #     self.action_horizon  = NUM_ACTIONS_CHUNK
    # constants.py 依据命令行参数自动探测平台 (detect_robot_platform), 无匹配时
    # 回退 G1_EE_6D。本文件按 G1_EE_6D 标注 (与 Arena G1 移动操作环境一致):
    #     NUM_ACTIONS_CHUNK=25, ACTION_DIM=23, PROPRIO_DIM=23, BOUNDS_Q99
    # 若改用其它平台 (LIBERO 7 / G1joint 16 / ALOHA 14 ...), 只改 constants.py 即可。
    action_dim: 23            # 未被读取; 真实值 = constants.ACTION_DIM
    state_dim: 23             # 未被读取; 真实值 = constants.PROPRIO_DIM
    action_horizon: 25        # 未被读取; 真实值 = constants.NUM_ACTIONS_CHUNK
    future_action_window_size: 24  # 未被读取; 实际由 NUM_ACTIONS_CHUNK-1 决定
    past_action_window_size: 0
    # ⚠ 注意: 这个键【不生效】。unifolm_vla.py 读的是 trainer.repeated_diffusion_steps
    # (本文件第 71 行 = 4)。此处保留仅为兼容原始配置格式。
    repeated_diffusion_steps: 8

    # ---- Flow Matching 噪声调度 ----
    noise_beta_alpha: 1.5                    # Beta 分布 α：采样时间步 t 的分布形状
    noise_beta_beta: 1.0                     # Beta 分布 β
    noise_s: 0.999                           # t 的缩放上限（避免 t=1 的数值奇点）
    num_timestep_buckets: 1000               # 连续 t 离散化到多少个桶
    num_inference_timesteps: 4               # 推理时 Euler 积分步数（越少越快）

    num_target_vision_tokens: 32             # "未来视觉"占位 token 数（CogACT 风格）

    # ---- DiT 主干（对应 DiT-L 规模） ----
    diffusion_model_cfg:
      cross_attention_dim: 2048              # 必须等于 Qwen 隐层维度（运行时会覆盖）
      attention_head_dim: 48
      num_attention_heads: 32                # 内层维度 = 32 × 48 = 1536
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true        # 奇数层做自注意力，偶数层做交叉注意力
      norm_type: "ada_norm"                  # 用时间步条件调制归一化
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null            # 动作位置编码由 action_model 负责

# ---------------------------------------------------------------------------
# 数据集（RLDS）
# ---------------------------------------------------------------------------
datasets:
  vla_data:
    data_root_dir: /path/to/your/data        # ★ 需修改：RLDS 数据根目录
    data_mix: your_data_mix                  # ★ 需修改：数据集名或组合名
    per_device_batch_size: 16                # 单卡批大小（总批 = 该值 × 进程数 × 累积步数）
    load_all_data_for_training: true
    window_size: 1                           # 送几帧历史观测（LIBERO 用 2）
    image_size: [224,224]                    # 与 Adapter 的缩放目标一致

# ---------------------------------------------------------------------------
# 训练器
# ---------------------------------------------------------------------------
trainer:
  epochs: 100
  max_train_steps: 100000                    # 实际以步数而非 epoch 为准
  num_warmup_steps: 5000                     # 学习率线性预热步数
  save_interval: 5000                        # 每多少步存一次 checkpoint
  eval_interval: 100                         # 每多少步做一次动作 MSE 评估

  # 分组学习率：不同模块可用不同学习率（build_param_lr_groups 按模块路径匹配）
  learning_rate:
    base: 1e-05                              # 未单列模块的默认学习率
    qwen_vl_interface: 1.0e-05               # VLM 主干（通常更小，避免破坏预训练）
    action_model: 1.0e-04                    # 动作头从零训练，学习率更大

  lr_scheduler_type: cosine_with_min_lr      # 余弦退火到 min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07                          # 退火下界，避免学习率归零

  freeze_modules: ''                         # 逗号分隔的模块路径；空 = 全部可训练
  loss_scale:
    vla: 1.0                                 # 损失权重（当前只有动作损失）
  # ⚠ 这个键才是真正生效的重复扩散步数（unifolm_vla.py 读取 trainer.*）
  repeated_diffusion_steps: 4

  max_grad_norm: 1.0                         # 梯度裁剪（记录用）
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10                      # 日志间隔（启动脚本会覆盖为 500）
  gradient_clipping: 1.0                     # 实际用于 clip_grad_norm_ 的值
  gradient_accumulation_steps: 1             # 梯度累积步数

  # 优化器
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  # ---------------------------------------------------------------------------
  # 断点续训 / 缩放策略
  # ---------------------------------------------------------------------------
  is_resume: false                           # 是否从 checkpoint 恢复训练状态
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true        # 用时间换显存
  enable_mixed_precision_training: true      # 混合精度（配合 bf16）
